[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picoret"
version = "1.0.0"
description = "An 817-parameter low-light image enhancement model"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "scikit-image>=0.21",
  "pytorch-msssim>=1.0",
]

[project.optional-dependencies]
data = ["gdown>=5.0"]
test = ["pytest>=7.0"]

[project.scripts]
picoret-infer = "picoret.infer:main"
picoret-train = "picoret.train:main"

[tool.setuptools.packages.find]
include = ["picoret*"]
